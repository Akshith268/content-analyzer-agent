<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ContentGuard Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .signup-card {
            max-width: 450px;
            margin: 0 auto;
            margin-top: 80px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="signup-card">
            <div class="card shadow">
                <div class="card-header text-center bg-white">
                    <h3><i class="fas fa-shield-alt"></i> ContentGuard Pro</h3>
                    <p class="text-muted">Create your account</p>
                </div>
                <div class="card-body">
                    {% if error %}
                    <div class="alert alert-danger" role="alert">
                        <i class="fas fa-exclamation-triangle"></i> {{ error }}
                    </div>
                    {% endif %}
                    
                    <form method="POST">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" required 
                                   placeholder="your@email.com">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required
                                   placeholder="Create a secure password">
                        </div>
                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required
                                   placeholder="Confirm your password">
                        </div>
                        
                        <!-- Plan Selection -->
                        <div class="mb-3">
                            <label class="form-label">Choose Your Plan</label>
                            <div class="card">
                                <div class="card-body p-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="plan" id="free_plan" value="free" checked>
                                        <label class="form-check-label" for="free_plan">
                                            <strong>Free Plan</strong> - 100 analyses/month
                                            <br><small class="text-muted">Perfect for trying out ContentGuard Pro</small>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="terms" required>
                            <label class="form-check-label" for="terms">
                                I agree to the <a href="#" class="text-decoration-none">Terms of Service</a> 
                                and <a href="#" class="text-decoration-none">Privacy Policy</a>
                            </label>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-user-plus"></i> Create Account
                            </button>
                        </div>
                    </form>
                    
                    <!-- Benefits -->
                    <div class="mt-4 p-3 bg-light rounded">
                        <h6><i class="fas fa-star"></i> What You Get:</h6>
                        <ul class="mb-0 small">
                            <li><i class="fas fa-check text-success"></i> 100 free content analyses</li>
                            <li><i class="fas fa-check text-success"></i> AI learning system</li>
                            <li><i class="fas fa-check text-success"></i> API access with key</li>
                            <li><i class="fas fa-check text-success"></i> Real-time analysis</li>
                        </ul>
                    </div>
                </div>
                <div class="card-footer text-center bg-white">
                    <p class="mb-0">
                        Already have an account? 
                        <a href="/login" class="text-decoration-none">Login here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Simple password confirmation validation
        document.getElementById('confirm_password').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            
            if (password !== confirmPassword) {
                this.setCustomValidity('Passwords do not match');
            } else {
                this.setCustomValidity('');
            }
        });
    </script>
</body>
</html>
